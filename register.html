<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 서재 - 작품 등록</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/HelloTIPOTI/novel-manager/main/star.png">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4 flex items-center justify-center">
    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
        <!-- 헤더 -->
        <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-indigo-600"></i> 새 작품 아카이브 등록
            </h1>
            <a href="index.html" class="text-slate-400 hover:text-slate-600 transition text-sm flex items-center gap-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </a>
        </div>

        <!-- 등록 폼 -->
        <form id="register-form" class="p-8 space-y-6" autocomplete="off">
            <!-- 기본 정보 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작품 제목 *</label>
                    <input type="text" id="title" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작가명 *</label>
                    <input type="text" id="author" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- 분류 및 플랫폼 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작품 분류</label>
                    <select id="category" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="웹소설">웹소설</option>
                        <option value="단행본">단행본</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">이용 형태</label>
                    <select id="acquisition-type" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="소장">소장</option>
                        <option value="대여">대여</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">플랫폼</label>
                    <select id="platform" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="리디">리디</option>
                        <option value="북큐브">북큐브</option>
                        <option value="카카오">카카오</option>
                        <option value="봄툰">봄툰</option>
                        <option value="알라딘">알라딘</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작품 링크 (URL)</label>
                    <input type="url" id="link" placeholder="https://..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- 권수 및 날짜/별점 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">전체(최신) 권수 *</label>
                    <input type="number" id="total" required min="1" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">미소장 권수</label>
                    <input type="number" id="missing" min="0" placeholder="0" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">별점 (0 ~ 5)</label>
                    <select id="rating" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="5">★★★★★ (5.0)</option>
                        <option value="4.5">★★★★☆ (4.5)</option>
                        <option value="4">★★★★ (4.0)</option>
                        <option value="3.5">★★★☆ (3.5)</option>
                        <option value="3">★★★ (3.0)</option>
                        <option value="2.5">★★☆ (2.5)</option>
                        <option value="2">★★ (2.0)</option>
                        <option value="1.5">★☆ (1.5)</option>
                        <option value="1">★ (1.0)</option>
                        <option value="0.5">☆ (0.5)</option>
                        <option value="0">없음 (0)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">구매일</label>
                    <input type="date" id="purchase-date" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">대여 종료일 (대여 시 기입)</label>
                    <input type="date" id="expire-date" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- 인생작 체크 -->
            <div class="flex items-center gap-2 pt-2">
                <input type="checkbox" id="is- 인생작" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                <label for="is-인생작" class="text-sm font-bold text-slate-800 cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-crown text-amber-500"></i> 인생작으로 등록하기
                </label>
            </div>

            <!-- 상세 아카이브 정보 -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">키워드 (띄어쓰기로 구분, # 자동 생성)</label>
                <input type="text" id="keywords" placeholder="회귀물 판타지 성장물" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작품 표지 이미지 주소 (구글 드라이브 주소, 콤마로 여러 장 입력 가능)</label>
                <input type="text" id="cover-images" placeholder="https://drive.google.com/..., https://drive.google.com/..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">등장인물 (HTML 서식 사용 가능)</label>
                <textarea id="characters" rows="3" placeholder="<b>주인공</b>: 클로드<br><b>조연</b>: ... " class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작품 소개 (HTML 서식 사용 가능)</label>
                <textarea id="description" rows="4" placeholder="작품 줄거리 입력..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">연작 가이드 (HTML 서식 사용 가능)</label>
                <textarea id="series-guide" rows="2" placeholder="외전 순서 등..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <!-- 버튼 -->
            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                <a href="index.html" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-medium transition">
                    취소
                </a>
                <button type="submit" id="submit-btn" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition shadow-sm cursor-pointer flex items-center gap-2">
                    등록하기
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) {
                alert('GitHub 연동 정보가 없습니다. 메인 페이지에서 [설정]을 먼저 완료해주세요.');
                window.location.href = 'index.html';
                return;
            }

            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const category = document.getElementById('category').value;
            const acquisitionType = document.getElementById('acquisition-type').value;
            const platform = document.getElementById('platform').value;
            const link = document.getElementById('link').value.trim() || '#';
            const total = parseInt(document.getElementById('total').value);
            const missingInput = document.getElementById('missing').value.trim();
            const missing = missingInput === '' ? 0 : parseInt(missingInput);
            const rating = parseFloat(document.getElementById('rating').value);
            const purchaseDate = document.getElementById('purchase-date').value;
            const expireDate = document.getElementById('expire-date').value;
            const isMasterpiece = document.getElementById('is-인생작').checked;
            const keywords = document.getElementById('keywords').value.trim();
            const coverImages = document.getElementById('cover-images').value.trim();
            const characters = document.getElementById('characters').value.trim();
            const description = document.getElementById('description').value.trim();
            const seriesGuide = document.getElementById('series-guide').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...`;

            try {
                const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/novels.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                let novels = [];
                let currentSha = '';

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    currentSha = fileData.sha;
                    const decodedJson = decodeURIComponent(escape(atob(fileData.content)));
                    novels = JSON.parse(decodedJson);
                }

                const newNovel = {
                    id: Date.now(),
                    title,
                    author,
                    category,
                    acquisitionType,
                    platform,
                    link,
                    total,
                    missing,
                    rating,
                    purchaseDate,
                    expireDate,
                    isMasterpiece,
                    keywords,
                    coverImages,
                    characters,
                    description,
                    seriesGuide
                };

                novels.push(newNovel);

                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(novels, null, 4))));
                
                const putOptions = {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add archive novel: ${title}`,
                        content: updatedContent,
                        ...(currentSha ? { sha: currentSha } : {})
                    })
                };

                const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/novels.json`, putOptions);
                if (!putRes.ok) throw new Error('GitHub에 저장 실패');

                alert('작품이 성공적으로 등록되었습니다!');
                window.location.href = 'index.html';

            } catch (error) {
                alert('오류 발생: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = `등록하기`;
            }
        });
    </script>
</body>
</html>
