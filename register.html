<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹소설 미소장 후속권 관리 - 작품 등록</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <!-- 헤더 -->
        <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-indigo-600"></i> 새 웹소설 등록 (GitHub 저장)
            </h1>
            <a href="index.html" class="text-slate-400 hover:text-slate-600 transition text-sm flex items-center gap-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </a>
        </div>

        <!-- 등록 폼 -->
        <form id="register-form" class="p-8 space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작품 제목</label>
                <input type="text" id="title" required placeholder="예: 미필적 고의에 의한 연애사" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">작가명</label>
                    <input type="text" id="author" required placeholder="예: 우주토깽" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">전체(최신) 권수</label>
                    <input type="number" id="total" required min="1" placeholder="예: 13" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">미소장 권수</label>
                <input type="number" id="missing" required min="0" placeholder="예: 2" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p class="text-xs text-slate-400 mt-1">내가 아직 소장하지 않은 후속권의 개수를 입력하세요.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1.5">리디북스 링크 (URL)</label>
                <input type="url" id="link" placeholder="https://ridibooks.com/books/..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                <a href="index.html" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-medium transition">
                    취소
                </a>
                <button type="submit" id="submit-btn" class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition shadow-sm cursor-pointer flex items-center gap-2">
                    등록하기
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) {
                alert('GitHub 연동 정보가 없습니다. 메인 페이지에서 [GitHub 설정]을 먼저 완료해주세요.');
                window.location.href = 'index.html';
                return;
            }

            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const total = parseInt(document.getElementById('total').value);
            const missing = parseInt(document.getElementById('missing').value);
            const link = document.getElementById('link').value.trim() || 'https://ridibooks.com';

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> GitHub에 저장 중...`;

            try {
                // 1. 기존 novels.json 파일과 현재 SHA 가져오기
                const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/novels.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (!getRes.ok) throw new Error('GitHub 파일을 읽어오는 데 실패했습니다.');
                const fileData = await getRes.json();
                
                const currentSha = fileData.sha;
                const decodedJson = decodeURIComponent(escape(atob(fileData.content)));
                let novels = JSON.parse(decodedJson);

                // 2. 새 작품 추가
                const newNovel = {
                    id: Date.now(),
                    title,
                    author,
                    total,
                    missing,
                    link
                };
                novels.push(newNovel);

                // 3. GitHub에 갱신된 JSON 커밋하기 (PUT 요청)
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(novels, null, 4))));
                
                const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/novels.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add new novel: ${title}`,
                        content: updatedContent,
                        sha: currentSha
                    })
                });

                if (!putRes.ok) throw new Error('GitHub에 변경사항을 저장하지 못했습니다.');

                alert('성공적으로 깃허브에 등록되었습니다!');
                window.location.href = 'index.html';

            } catch (error) {
                alert('오류 발생: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = `등록하기`;
            }
        });
    </script>
</body>
</html>
